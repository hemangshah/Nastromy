<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="skyGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a1060"/>
      <stop offset="40%" stop-color="#0d0830"/>
      <stop offset="100%" stop-color="#040210"/>
    </radialGradient>

    <!-- Nebula glow -->
    <radialGradient id="nebulaA" cx="30%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#7b2fff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="72%" cy="65%" r="38%">
      <stop offset="0%" stop-color="#00b4ff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#00b4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="60%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#ff6030" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ff6030" stop-opacity="0"/>
    </radialGradient>

    <!-- Lens flare for telescope -->
    <radialGradient id="lensFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="30%" stop-color="#a0e0ff" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#a0e0ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Telescope body gradient -->
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d8f0"/>
      <stop offset="30%" stop-color="#8aaad4"/>
      <stop offset="70%" stop-color="#4a6a9a"/>
      <stop offset="100%" stop-color="#2a3a5a"/>
    </linearGradient>
    <linearGradient id="tubeGradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8aaad4"/>
      <stop offset="50%" stop-color="#c8d8f0"/>
      <stop offset="100%" stop-color="#5a7aaa"/>
    </linearGradient>
    <linearGradient id="mountGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a7a9a"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>

    <!-- Ring glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="1024" height="1024" fill="url(#skyGrad)"/>
  <rect width="1024" height="1024" fill="url(#nebulaA)"/>
  <rect width="1024" height="1024" fill="url(#nebulaB)"/>
  <rect width="1024" height="1024" fill="url(#nebulaC)"/>

  <!-- Star field -->
  <g fill="white">
    <!-- tiny stars -->
    <circle cx="80" cy="60" r="1.2" opacity=".7"/>
    <circle cx="180" cy="120" r="1" opacity=".5"/>
    <circle cx="300" cy="50" r="1.5" opacity=".8"/>
    <circle cx="450" cy="90" r="1" opacity=".6"/>
    <circle cx="600" cy="40" r="1.3" opacity=".75"/>
    <circle cx="750" cy="80" r="1" opacity=".5"/>
    <circle cx="880" cy="55" r="1.4" opacity=".7"/>
    <circle cx="950" cy="140" r="1" opacity=".55"/>
    <circle cx="60" cy="200" r="1.2" opacity=".65"/>
    <circle cx="140" cy="280" r="1" opacity=".5"/>
    <circle cx="920" cy="220" r="1.3" opacity=".7"/>
    <circle cx="980" cy="310" r="1" opacity=".6"/>
    <circle cx="70" cy="380" r="1.1" opacity=".55"/>
    <circle cx="200" cy="430" r="1" opacity=".5"/>
    <circle cx="960" cy="420" r="1.2" opacity=".65"/>
    <circle cx="50" cy="550" r="1" opacity=".5"/>
    <circle cx="990" cy="560" r="1.3" opacity=".7"/>
    <circle cx="100" cy="700" r="1" opacity=".55"/>
    <circle cx="950" cy="680" r="1.2" opacity=".6"/>
    <circle cx="120" cy="820" r="1" opacity=".5"/>
    <circle cx="900" cy="800" r="1.3" opacity=".65"/>
    <circle cx="200" cy="920" r="1.1" opacity=".55"/>
    <circle cx="800" cy="940" r="1" opacity=".5"/>
    <circle cx="400" cy="970" r="1.2" opacity=".6"/>
    <!-- medium stars -->
    <circle cx="350" cy="130" r="2" opacity=".8"/>
    <circle cx="700" cy="160" r="1.8" opacity=".75"/>
    <circle cx="850" cy="300" r="2.2" opacity=".85"/>
    <circle cx="150" cy="460" r="1.8" opacity=".7"/>
    <circle cx="870" cy="500" r="2" opacity=".8"/>
    <circle cx="300" cy="750" r="1.8" opacity=".7"/>
    <circle cx="750" cy="780" r="2" opacity=".75"/>
    <!-- bright twinkle stars -->
    <circle cx="780" cy="110" r="3" opacity=".9" filter="url(#softGlow)"/>
    <circle cx="160" cy="350" r="2.5" opacity=".85" filter="url(#softGlow)"/>
    <circle cx="900" cy="650" r="3" opacity=".9" filter="url(#softGlow)"/>
    <circle cx="250" cy="880" r="2.5" opacity=".85" filter="url(#softGlow)"/>
  </g>

  <!-- === TELESCOPE — centred === -->
  <g transform="translate(512, 680)">
    <!-- Tripod legs -->
    <line x1="0" y1="0" x2="-130" y2="210" stroke="#4a5a7a" stroke-width="18" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="130" y2="210" stroke="#4a5a7a" stroke-width="18" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#3a4a6a" stroke-width="18" stroke-linecap="round"/>
    <!-- Spreader bar -->
    <line x1="-88" y1="142" x2="88" y2="142" stroke="#3a4a6a" stroke-width="10" stroke-linecap="round"/>
    <!-- Mount head -->
    <circle cx="0" cy="0" r="44" fill="url(#mountGrad)" stroke="#7a8aaa" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" fill="#2a3a5a"/>
  </g>

  <!-- Optical tube assembly — centred, tall, pointing upper-left ~-45° -->
  <g transform="translate(512, 632) rotate(-45)">
    <!-- Counterweight bar -->
    <rect x="-13" y="40" width="26" height="165" rx="13" fill="url(#mountGrad)" stroke="#5a6a8a" stroke-width="2.5"/>
    <!-- Counterweight -->
    <ellipse cx="0" cy="218" rx="38" ry="28" fill="#3a4a6a" stroke="#6a7a9a" stroke-width="2.5"/>

    <!-- Focuser drawtube -->
    <rect x="-24" y="-72" width="48" height="72" rx="6" fill="#3a4a6a" stroke="#6a7a9a" stroke-width="2.5"/>
    <!-- Focus knobs -->
    <ellipse cx="30" cy="-38" rx="17" ry="11" fill="#5a6a8a" stroke="#8a9aaa" stroke-width="2"/>
    <ellipse cx="30" cy="-14" rx="17" ry="11" fill="#4a5a7a" stroke="#7a8aaa" stroke-width="2"/>

    <!-- Main optical tube -->
    <rect x="-50" y="-460" width="100" height="400" rx="20"
          fill="url(#tubeGrad)" stroke="rgba(255,255,255,.28)" stroke-width="2.5"/>
    <!-- Tube highlight stripe -->
    <rect x="-37" y="-454" width="18" height="388" rx="7"
          fill="rgba(255,255,255,.2)"/>
    <!-- Tube band rings -->
    <rect x="-50" y="-385" width="100" height="17" rx="5" fill="#3a5a8a" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>
    <rect x="-50" y="-258" width="100" height="17" rx="5" fill="#3a5a8a" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>
    <rect x="-50" y="-132" width="100" height="17" rx="5" fill="#3a5a8a" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>

    <!-- Finder scope -->
    <rect x="52" y="-382" width="24" height="138" rx="9"
          fill="#5a6a8a" stroke="#8a9aaa" stroke-width="2"/>
    <!-- Finder objective -->
    <ellipse cx="64" cy="-382" rx="12" ry="9" fill="#1a2a4a" stroke="#7a9ac0" stroke-width="2"/>

    <!-- Dew shield -->
    <rect x="-55" y="-500" width="110" height="46" rx="10"
          fill="#1e2e4e" stroke="#6a8ab0" stroke-width="2.5"/>

    <!-- Objective lens cell -->
    <ellipse cx="0" cy="-460" rx="56" ry="20"
             fill="#1a2a4a" stroke="#7a9ac0" stroke-width="4"/>
    <!-- Lens glass -->
    <ellipse cx="0" cy="-460" rx="47" ry="16"
             fill="#080f20"/>
    <ellipse cx="-15" cy="-466" rx="17" ry="7"
             fill="rgba(120,180,255,.32)"/>
    <ellipse cx="12" cy="-457" rx="8" ry="4"
             fill="rgba(180,220,255,.2)"/>

    <!-- Lens flare -->
    <circle cx="0" cy="-460" r="32" fill="url(#lensFlare)" opacity=".65" filter="url(#softGlow)"/>
  </g>

  <!-- Lens flare ray from objective (pointing upper-left from centre) -->
  <g transform="translate(300, 210) rotate(-45)" opacity=".45" filter="url(#softGlow)">
    <ellipse cx="0" cy="0" rx="5" ry="120" fill="url(#lensFlare)"/>
  </g>

  <!-- Sparkle at objective end -->
  <g transform="translate(300, 210)" filter="url(#glow)">
    <circle r="12" fill="#a0d8ff" opacity=".9"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#a0d8ff" stroke-width="2.5" opacity=".75"/>
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#a0d8ff" stroke-width="2.5" opacity=".75"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#a0d8ff" stroke-width="2" opacity=".5"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#a0d8ff" stroke-width="2" opacity=".5"/>
  </g>
</svg>
</div>
<p>Nastromy · App Icon concept · 1024 × 1024</p>
